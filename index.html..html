<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Amigo Secreto 🩴</title>
<style>
:root{--bg:#fff7ec;--card:#fff;--tx:#2b1d12;--mut:#7a6552;--ac:#e8590c;--ac2:#2f9e44;--bd:#f0d9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1510;--card:#2a1e16;--tx:#fbefe1;--mut:#c2a98f;--bd:#4a3626}}
:root[data-theme="dark"]{--bg:#1d1510;--card:#2a1e16;--tx:#fbefe1;--mut:#c2a98f;--bd:#4a3626}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:26px;margin:0 0 6px}p{color:var(--mut);margin:6px 0 18px;line-height:1.4}
select,button{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:12px}
button{background:var(--ac);color:#fff;border:0;font-weight:700;cursor:pointer}button.s{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:400}
.big{font-size:38px;font-weight:800;color:var(--ac);margin:8px 0}.chip{display:inline-block;background:var(--ac2);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:20px;margin:6px 0}
.note{color:var(--mut);margin-top:10px}.hide{display:none}
</style></head><body><div class="c">
<div id="v1"><h1>🎁 Amigo Secreto 🩴</h1><p>Escolha o seu nome para descobrir quem você tirou. Não vale espiar o resultado dos outros!</p>
<select id="sel"><option value="">Selecione seu nome…</option><option>Agatha</option><option>Claudia</option><option>Cláudio</option><option>Eduardo</option><option>Flávia</option><option>Gabi</option><option>Isabella</option><option>Joaquim</option><option>Jp</option><option>Lucas</option><option>Lucimar</option><option>Luiza</option><option>Marcelle</option><option>Marina</option><option>Pedro</option><option>Rafaella</option><option>Regina</option><option>Rubens</option><option>Sofia</option><option>Tais</option><option>Tati</option><option>Thiago</option><option>Thiaguinho</option></select><button id="go">Descobrir meu amigo secreto</button></div>
<div id="v2" class="hide"><p>Confirma que você é</p><div class="big" id="me"></div><button id="ok">Sim, sou eu! Revelar</button><button class="s" id="back">Não, voltar</button></div>
<div id="v3" class="hide"><p>Seu amigo secreto é…</p><div class="big" id="who"></div><p>Número do chinelo Havaianas:</p><div class="chip" id="sz"></div><div class="note" id="ob"></div><p style="margin-top:22px">🤫 Shhh… é segredo! Guarde para você.</p><button class="s" id="again">Voltar ao início</button></div>
</div><script>
var D={"Marcelle": "eyJuIjogIkpwIiwgInMiOiAiNDAiLCAibyI6ICIifQ==", "Jp": "eyJuIjogIlRhaXMiLCAicyI6ICIzNSIsICJvIjogIlRpcmEgZ3Jvc3NhIn0=", "Tais": "eyJuIjogIkpvYXF1aW0iLCAicyI6ICIzOSIsICJvIjogIiJ9", "Joaquim": "eyJuIjogIkx1Y2FzIiwgInMiOiAiNDAiLCAibyI6ICIifQ==", "Lucas": "eyJuIjogIkZsw6F2aWEiLCAicyI6ICIzNyIsICJvIjogIiJ9", "Flávia": "eyJuIjogIk1hcmluYSIsICJzIjogIjM3IiwgIm8iOiAiVGlyYSBncm9zc2EifQ==", "Marina": "eyJuIjogIlRoaWFndWluaG8iLCAicyI6ICIyOS8zMCIsICJvIjogIiJ9", "Rafaella": "eyJuIjogIlNvZmlhIiwgInMiOiAiMzciLCAibyI6ICIifQ==", "Sofia": "eyJuIjogIkNsw6F1ZGlvIiwgInMiOiAiNDIiLCAibyI6ICIifQ==", "Cláudio": "eyJuIjogIklzYWJlbGxhIiwgInMiOiAiMzgiLCAibyI6ICJOw6NvIHF1ZXIgY2hpbmVsbyBxdWFkcmFkbyJ9", "Isabella": "eyJuIjogIkx1aXphIiwgInMiOiAiMzciLCAibyI6ICIifQ==", "Luiza": "eyJuIjogIkVkdWFyZG8iLCAicyI6ICI0NCIsICJvIjogIiJ9", "Eduardo": "eyJuIjogIlRhdGkiLCAicyI6ICIzOSIsICJvIjogIiJ9", "Agatha": "eyJuIjogIkdhYmkiLCAicyI6ICIzOC8zOSIsICJvIjogIiJ9", "Gabi": "eyJuIjogIlJ1YmVucyIsICJzIjogIjQxLzQyIiwgIm8iOiAiIn0=", "Rubens": "eyJuIjogIkx1Y2ltYXIiLCAicyI6ICIzNS8zNiIsICJvIjogIiJ9", "Lucimar": "eyJuIjogIkNsYXVkaWEiLCAicyI6ICIzOS80MCIsICJvIjogIiJ9", "Claudia": "eyJuIjogIlJlZ2luYSIsICJzIjogIjQwLzQxIiwgIm8iOiAiIn0=", "Regina": "eyJuIjogIlBlZHJvIiwgInMiOiAiMzQiLCAibyI6ICIifQ==", "Pedro": "eyJuIjogIlRoaWFnbyIsICJzIjogIjQxLzQyIiwgIm8iOiAiIn0=", "Thiago": "eyJuIjogIk1hcmNlbGxlIiwgInMiOiAiMzciLCAibyI6ICJUaXJhIGZpbmEifQ==", "Tati": "eyJuIjogIkFnYXRoYSIsICJzIjogIjM3LzM4IiwgIm8iOiAiIn0=", "Thiaguinho": "eyJuIjogIlJhZmFlbGxhIiwgInMiOiAiMzYvMzciLCAibyI6ICIifQ=="};
function $(i){return document.getElementById(i)}
function show(i){["v1","v2","v3"].forEach(function(x){$(x).classList.toggle("hide",x!==i)})}
function dec(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(a))}
$("go").onclick=function(){var n=$("sel").value;if(!n)return;$("me").textContent=n;show("v2")};
$("back").onclick=function(){show("v1")};
$("ok").onclick=function(){var r=dec(D[$("sel").value]);$("who").textContent=r.n;$("sz").textContent=r.s;$("ob").textContent=r.o?"Observação: "+r.o:"";show("v3")};
$("again").onclick=function(){$("sel").value="";show("v1")};
</script></body></html>
